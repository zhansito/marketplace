{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <title>{% block title %}Marketplace{% endblock %}</title>
</head>
<body>
    <header>
        <h1><a href="{% url 'catalog:product_list' %}">Marketplace</a> </h1>

        <nav>
            <a href="{% url 'catalog:product_list' %}">Catalog</a>
        </nav>
    </header>

    <main>
        {% if messages %}
            {% for message in messages %}
                <p>{{ message }}</p>
            {% endfor %}
        {% endif %}

        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>Marketplace Demo Project</p>
    </footer>
</body>
</html>
