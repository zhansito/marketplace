{% extends "base.html" %}

{% block title %}Login | Marketplace{% endblock %}

{% block content %}
    <section class="form-card">
        <h1>Login</h1>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Login</button>
        </form>

        <p>Don't have an account?
            <a href="{% url 'users:register' %}">Register</a>
        </p>
    </section>
{% endblock %}
